[project]
name = "lichtpult"
version = "0.1.0"
description = "Lichtsteuerung für das Kellertheater (ENTTEC DMX USB Pro, 3D-Bühne im Browser)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "pyserial>=3.5",
    "pydantic>=2.12",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lichtpult"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
